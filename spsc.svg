<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940"
     role="img" aria-labelledby="title description">
  <title id="title">SPSCQueue memory layout</title>
  <desc id="description">
    The queue stores capacity, a slots pointer, and an allocator. Producer-owned
    writeIdx and readIdxCache share an aligned region, separate from consumer-owned
    readIdx and writeIdxCache. The slots pointer refers to a separate allocation
    with padding before and after the elements. Each atomic index is written by
    its owner and read by the other thread; cached indices are accessed only by
    their owner. The producer constructs elements; the consumer reads and destroys
    them. Ownership is indicated by text as well as color. One extra slot distinguishes full
    from empty. An illustrative capacity-four queue has five slots, with readIdx
    equal to one and writeIdx equal to three: slots one and two contain queued
    elements. Labeled arrows identify the next element to consume and the next
    slot to construct into. Available slots have dashed borders. Indices are
    offsets into the ring, after the leading padding. This is a schematic,
    not a byte-accurate layout.
  </desc>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f2328;
      --muted: #59636e;
      --line: #657180;
      --surface: #f6f8fa;
      --padding: #eaeef2;
      --producer: #ddf4ff;
      --producer-line: #0969a1;
      --consumer: #fff1df;
      --consumer-line: #9a4d00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3;
        --muted: #a5afba;
        --line: #8b98a7;
        --surface: #161b22;
        --padding: #252d38;
        --producer: #102f46;
        --producer-line: #79c0ff;
        --consumer: #3b2818;
        --consumer-line: #ffbf69;
      }
    }
    text { fill: var(--fg); font: 18px system-ui, sans-serif; }
    .heading { font-size: 26px; font-weight: 650; }
    .section { font-size: 20px; font-weight: 600; }
    .note { fill: var(--muted); font-size: 15px; }
    .label { text-anchor: middle; dominant-baseline: middle; }
    .code { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 17px; }
    .cell { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .available { stroke-dasharray: 5 4; }
    .pad { fill: url(#hatch); stroke: var(--line); stroke-width: 1.5; }
    .producer { fill: var(--producer); stroke: var(--producer-line); stroke-width: 1.5; }
    .consumer { fill: var(--consumer); stroke: var(--consumer-line); stroke-width: 1.5; }
    .producer-text { fill: var(--producer-line); }
    .consumer-text { fill: var(--consumer-line); }
    .line { fill: none; stroke: var(--line); stroke-width: 1.5; }
  </style>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="var(--padding)"/>
      <path d="M-2 2 2-2 M0 10 10 0 M8 12 12 8" stroke="var(--line)" opacity="0.35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="var(--line)"/>
    </marker>
  </defs>

  <text x="48" y="42" class="heading">SPSCQueue memory layout</text>
  <text x="48" y="70" class="note">Schematic · field widths and padding are not to scale</text>

  <!-- Metadata precedes the aligned indices; allocator size depends on its type. -->
  <text x="48" y="112" class="section">Queue object</text>
  <rect x="48" y="132" width="180" height="56" class="cell"/>
  <rect x="228" y="132" width="180" height="56" class="cell"/>
  <rect x="408" y="132" width="240" height="56" class="cell"/>
  <text x="138" y="160" class="label code">capacity_</text>
  <text x="318" y="160" class="label code">slots_</text>
  <text x="528" y="160" class="label code">allocator_</text>
  <text x="674" y="155" class="note">Allocator storage depends</text>
  <text x="674" y="177" class="note">on its type and language mode.</text>

  <!-- Each index is aligned to kCacheLineSize; its owner's cache follows it. -->
  <text x="48" y="242" class="section producer-text">Producer-owned · producer writes</text>
  <text x="584" y="242" class="section consumer-text">Consumer-owned · consumer writes</text>
  <path d="M48 266V254H536V266 M584 266V254H1072V266" class="line"/>
  <rect x="48" y="274" width="170" height="100" class="producer"/>
  <rect x="218" y="274" width="222" height="100" class="producer"/>
  <rect x="440" y="274" width="96" height="100" class="pad"/>
  <text x="133" y="296" class="label code">writeIdx_</text>
  <text x="329" y="296" class="label code">readIdxCache_</text>
  <text x="488" y="324" class="label note">Pad</text>
  <rect x="584" y="274" width="170" height="100" class="consumer"/>
  <rect x="754" y="274" width="222" height="100" class="consumer"/>
  <rect x="976" y="274" width="96" height="100" class="pad"/>
  <text x="669" y="296" class="label code">readIdx_</text>
  <text x="865" y="296" class="label code">writeIdxCache_</text>
  <text x="1024" y="324" class="label note">Pad</text>
  <text x="133" y="323" class="label note">Atomic</text>
  <text x="133" y="349" class="label note">Consumer reads</text>
  <text x="329" y="323" class="label note">Thread-private cache</text>
  <text x="329" y="349" class="label note">Producer only</text>
  <text x="669" y="323" class="label note">Atomic</text>
  <text x="669" y="349" class="label note">Producer reads</text>
  <text x="865" y="323" class="label note">Thread-private cache</text>
  <text x="865" y="349" class="label note">Consumer only</text>
  <text x="48" y="404" class="note">Each thread caches the other index to reduce cross-thread atomic loads.</text>
  <text x="560" y="438" class="label note">Indices start on separate false-sharing boundaries (kCacheLineSize).</text>

  <!-- A snapshot of a capacity-four queue: ring indices run from zero to four. -->
  <path d="M318 188V208H24V650H47" class="line" marker-end="url(#arrow)"/>
  <text x="48" y="505" class="section">Element storage · separate allocation</text>
  <text x="48" y="532" class="note">Example snapshot: capacity() = 4, five ring slots, two queued elements</text>

  <!-- Index arrows are labels for offsets, not pointers or cached-index values. -->
  <text x="416" y="559" class="label code consumer-text">readIdx_ = 1</text>
  <text x="416" y="581" class="label note">Next to consume</text>
  <path d="M416 592V615" class="line" marker-end="url(#arrow)"/>
  <text x="704" y="559" class="label code producer-text">writeIdx_ = 3</text>
  <text x="704" y="581" class="label note">Next to construct into</text>
  <path d="M704 592V615" class="line" marker-end="url(#arrow)"/>

  <rect x="48" y="618" width="152" height="84" class="pad"/>
  <!-- Inset available cells make their dashed borders visible on every side. -->
  <rect x="204" y="622" width="136" height="76" class="cell available"/>
  <rect x="344" y="618" width="144" height="84" class="cell"/>
  <rect x="488" y="618" width="144" height="84" class="cell"/>
  <rect x="636" y="622" width="136" height="76" class="cell available"/>
  <rect x="780" y="622" width="136" height="76" class="cell available"/>
  <rect x="920" y="618" width="152" height="84" class="pad"/>
  <text x="124" y="660" class="label">Pad</text>
  <text x="272" y="644" class="label code">slot 0</text>
  <text x="272" y="677" class="label note">Available</text>
  <text x="416" y="644" class="label code">T · slot 1</text>
  <text x="416" y="677" class="label">Queued</text>
  <text x="560" y="644" class="label code">T · slot 2</text>
  <text x="560" y="677" class="label">Queued</text>
  <text x="704" y="644" class="label code">slot 3</text>
  <text x="704" y="677" class="label note">Available</text>
  <text x="848" y="644" class="label code">slot 4</text>
  <text x="848" y="677" class="label note">Available</text>
  <text x="996" y="660" class="label">Pad</text>
  <path d="M48 712V724H200V712 M200 712V724H920V712 M920 712V724H1072V712" class="line"/>
  <text x="124" y="748" class="label note">kPadding elements</text>
  <text x="560" y="748" class="label code">capacity() + 1 slots</text>
  <text x="996" y="748" class="label note">kPadding elements</text>
  <text x="560" y="786" class="label code">Element address = &amp;slots_[kPadding + index]</text>
  <text x="560" y="816" class="label note">Indices wrap from 4 to 0 in this example; padding is outside the ring.</text>
  <text x="560" y="843" class="label note">One slot must remain unused to distinguish full from empty; it is not a fixed slot.</text>
  <text x="560" y="870" class="label note">Solid + “Queued” = constructed element; dashed + “Available” = no queued element.</text>
  <text x="560" y="897" class="label note">Producer constructs/enqueues; consumer reads/destroys. Both read capacity_ and slots_.</text>
  <text x="560" y="924" class="label note">Access labels describe enqueue/dequeue; size() and empty() read both atomic indices.</text>
</svg>
