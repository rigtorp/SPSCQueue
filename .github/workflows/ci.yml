name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    uses: rigtorp/.github/.github/workflows/cpp-ci.yml@master
    with:
      cxx-standards: '["11", "17", "20"]'
      run-sanitizers: true
      enable-windows: true
      enable-macos: true
      warnings-as-errors: true
