name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    uses: rigtorp/.github/.github/workflows/cpp-ci.yml@master
    with:
      cxx-standards: '["20"]'
      run-sanitizers: true
      enable-windows: true
      enable-macos: true
      warnings-as-errors: true

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14
      - name: Configure, build, and test with MC/DC coverage
        env:
          CXX: g++-14
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (Android ${{ matrix.abi }})
        run: |
          NDK_TOOLCHAIN="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}/build/cmake/android.toolchain.cmake"
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_TOOLCHAIN}" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-24
          cmake --build build-android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (iOS simulator)
        run: |
          cmake -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build build-ios --config Release
